# Pipeline configuration. Every training run logs this file to MLflow.

data:
  # Path to the Edge-IIoTset CSV (e.g. DNN-EdgeIIoT-dataset.csv from Kaggle).
  # CI uses a small synthetic sample generated by scripts/make_sample_data.py.
  path: data/edge_iiotset.csv
  target: Attack_label          # 0 = normal, 1 = attack
  # Columns that identify a specific capture (hosts, timestamps, sequence numbers,
  # checksums) rather than describing traffic behaviour. Training on them inflates
  # accuracy without generalising -- the leakage problem from the research audit.
  drop_columns:
    - frame.time
    - ip.src_host
    - ip.dst_host
    - arp.src.proto_ipv4
    - arp.dst.proto_ipv4
    - tcp.seq
    - tcp.ack
    - tcp.ack_raw
    - tcp.checksum
    - icmp.checksum
    - icmp.transmit_timestamp
    - udp.stream
    - tcp.srcport               # ports: mostly ephemeral numbers that identify a connection
    - tcp.dstport
    - udp.port
    - mbtcp.trans_id
    - Attack_type               # multi-class label: would leak the target
  # Leave empty to use every remaining numeric column, or list the minimal
  # feature set selected with SHAP in the research audit.
  features: ["tcp.dstport_service", "tcp.flags", "tcp.len"]
  test_size: 0.2
  random_state: 42

model:
  type: decision_tree           # decision_tree | random_forest
  params:
    max_depth: 12
    min_samples_leaf: 5

quality_gate:
  # Training exits with an error (and CI fails) if the model is below this bar.
  # Leakage-safe models on Edge-IIoTset reach ~0.81 MCC; anything under 0.75
  # signals a broken pipeline or bad data.
  min_mcc: 0.75

mlflow:
  experiment: iot-intrusion-detection
  registered_model_name: iot-ids-classifier

output_dir: models
