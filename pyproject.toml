[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ids"
version = "0.1.0"
description = "Leakage-safe IoT intrusion detection with MLflow tracking, FastAPI serving and drift monitoring"
authors = [{ name = "Pranto Mollik" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "mlflow>=2.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
select = ["shap>=0.44"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "shap>=0.44"]

[project.scripts]
iot-ids-train = "iot_ids.train:main"
iot-ids-drift = "iot_ids.drift:main"
iot-ids-select = "iot_ids.select_features:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
